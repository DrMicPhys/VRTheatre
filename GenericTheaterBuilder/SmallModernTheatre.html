
<!DOCTYPE html>
<html>
  <head>
      <!-- based on GTB.5.0.html -->
    <title>A Small Theater</title>
	<script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>
    <script src="GTB.scripts.js"></script>




  </head>
  <body>
    <a-scene >
        <a-entity light="type: ambient; color: #666"></a-entity>
        <a-entity visible="false" gltf-model="navmeshGTB4.gltf" nav-mesh></a-entity>
		<a-entity id="rig" movement-controls="constrainToNavMesh: true" position="0 0 0">
            <a-entity camera
            position="0 1.6 0"
            look-controls="pointerLockEnabled: true">
                <a-entity id="scriptpage" 
                text="color:orange;value: future test;" scale=".7 .7 .7" position="-0 -.15 -1"></a-entity>
                <a-entity visible="false" meta-touch-controls="hand: left" ></a-entity>	
                <a-entity visible="false" meta-touch-controls="hand: right" ></a-entity>	
                <a-cursor nav-pointer  raycaster="objects: [nav-mesh]" visible="false"></a-cursor>
            </a-entity>
		</a-entity>

        <!--    Seats       -->
        <a-entity rotation="0 180 0">
            <a-box height="3.301" width="26" depth="5" position="0 1.65 -18" color="#88F">
            <a-entity rotation="16.5 0 0" position="0 1.65 2.5">
                <a-box scale="26 .01 15" position="0 -.005 7.5" color="#8080F0"></a-box>
            </a-entity>
                
            </a-box>

            <a-entity id="centerrows" position="0 0 -4">
                <script>
                    buildRows("#centerrows", 20,12);
                </script>
            </a-entity>
            <a-entity id="leftrows" position="-9 0 -4">
                <script>
                    buildRows("#leftrows", 8,12);
                </script>
            </a-entity>
            <a-entity id="rightrows" position="9 0 -4">
                <script>
                    buildRows("#rightrows", 8,12);
                </script>
            </a-entity>        
        </a-entity>
    <!-- Walls and floor -->        
    <a-plane position="0 0 0" rotation="-90 0 0" width="40" height="40" color="#005"></a-plane>
    <a-box scale="40 .1 40" src="CeilingTexture.jpg" repeat="20 20" position="0 10 0"></a-box>
    <a-box scale="1 12 40" src="BasicTheaterWall.jpg" repeat="20 6" position="13 6 0"></a-box>
    <a-box scale="1 12 40" src="BasicTheaterWall.jpg" repeat="20 6" position="-13 6 0"></a-box>
    <a-box scale="41 12 1" src="BasicTheaterWall.jpg" repeat="20 6" position="0 6 20.5"></a-box>
    <a-box scale="41 12 1" src="BasicTheaterWall.jpg" repeat="20 6" position="0 6 -20.5"></a-box>
     <!-- stage -->
    <a-entity position="0 0 -1">
        <a-box scale="26 1.2 24" position="0 0.6 -12" src="20_Wood floor_reduced.jpg" repeat="6 6"></a-box>
        <a-box scale="26 1.195 24" position="0 0.6 -11.9" color="#5A301C"></a-box>
        <a-entity rotation="30 0 0" position="-8.2 1.2 0">
            <a-box scale="2 1.2 5" position="0 -.6 2.5" color="#7D4326"></a-box>
        </a-entity>
        <a-entity rotation="30 0 0" position="8.2 1.2 0">
            <a-box scale="2 1.2 5" position="0 -.6 2.5" color="#7D4326"></a-box>
        </a-entity>
        <!-- Curtains -->
        <a-entity position="0 3.7 -3">
            <a-box scale="12 5 .01" src="CurtainTexture.jpg" repeat="3 1" position="-9 0 -2"></a-box>
            <a-box scale="26 .1 .1" color="gray" position="0 2.5 -2"></a-box>
            <a-box scale="26 .1 .1" color="gray" position="0 2.5 -10"></a-box>
            <a-box scale="12 5 .01" src="CurtainTexture.jpg" repeat="3 1" position="9 0 -2"></a-box>
            <a-box scale="20 5 .01" src="CurtainTexture.jpg" repeat="3 1" position="0 0 -10"></a-box>
        </a-entity>
        <!-- Lighting rig, adapted from jmc8941 individual project, SP 20204 -->
       <a-entity position="0 7 0"> 
            <a-cylinder height="13" radius=".03" color="black" rotation="0 0 90"></a-cylinder>
            <a-cylinder height="13" radius=".03" color="black" position="-6.5 6.5 0"></a-cylinder>
            <a-cylinder height="13" radius=".03" color="black" position="6.5 6.5 0"></a-cylinder>
            <a-entity rotation="-70 0 0">
                <a-entity position="0 0 0"><!--central light -->
                    <a-entity  light="type: spot; angle: 15; target:null"></a-entity>
                    <a-cone color="white" height=".3" radius-top=".15" radius-bottom=".2" rotation="90 0 0"></a-cone>
                    <a-circle material="side:double; color:#FFF; emissive:#FFF" radius=".19" position="0 0 -.16"></a-circle>
                </a-entity>
                <a-entity position="3 0 0">
                    <a-entity  light="type: spot; angle: 15; target:null; color:#CAA"></a-entity>
                    <a-cone color="white" height=".3" radius-top=".15" radius-bottom=".2" rotation="90 0 0"></a-cone>
                    <a-circle material="side:double; color:#FFF; emissive:#DAA" radius=".19" position="0 0 -.16"></a-circle>
                </a-entity>
                <a-entity position="-3 0 0">
                    <a-entity  light="type: spot; angle: 15; target:null; color:#CAA"></a-entity>
                    <a-cone color="white" height=".3" radius-top=".15" radius-bottom=".2" rotation="90 0 0"></a-cone>
                    <a-circle material="side:double; color:#FFF; emissive:#DAA" radius=".19" position="0 0 -.16"></a-circle>
                </a-entity>
                <a-entity position="6 0 0">
                    <a-entity  light="type: spot; angle: 15; target:null; color:#CAA"></a-entity>
                    <a-cone color="white" height=".3" radius-top=".15" radius-bottom=".2" rotation="90 0 0"></a-cone>
                    <a-circle material="side:double; color:#FFF; emissive:#DAA" radius=".19" position="0 0 -.16"></a-circle>
                </a-entity>
                <a-entity position="-6 0 0">
                    <a-entity  light="type: spot; angle: 15; target:null; color:#CAA"></a-entity>
                    <a-cone color="white" height=".3" radius-top=".15" radius-bottom=".2" rotation="90 0 0"></a-cone>
                    <a-circle material="side:double; color:#FFF; emissive:#DAA" radius=".19" position="0 0 -.16"></a-circle>
                </a-entity>
            </a-entity>
        </a-entity>        
    </a-entity>

    </a-scene>
    <script src="theaterpagerSmallModernTheatre.js"></script>  </body>
</html>
