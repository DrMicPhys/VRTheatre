<!DOCTYPE html>
<html lang="en" translate="no">
    <head>
        <title>Greek Theatre </title>
        <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
        <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>
        <script src="https://unpkg.com/aframe-environment-component@1.4.0/dist/aframe-environment-component.min.js"></script>

    </head>
    <body>
        <a-scene>
            <a-assets>
                <a-asset-item id="column" src="FullColumnWhite.glb"></a-asset-item>
                <a-asset-item id="dionysus" src="Dionysus.glb"></a-asset-item>
                <a-asset-item id="apollo" src="Apollo.glb"></a-asset-item>
                <a-asset-item id="ComedyM" src="ComedyMask2.glb"></a-asset-item>
                <a-asset-item id="TragedyM" src="TragedyMask2.glb"></a-asset-item>
                <a-asset-item id="GreekM" src="GreekInspiredMask2.glb"></a-asset-item>
            </a-assets>
            <a-entity rotation="0 180 0" position="10  0  22" scale="2 2 2">
                <a-entity gltf-model="#column"  ></a-entity>
                <a-entity gltf-model="#dionysus" scale=".3 .3 .3" position="0  4  0" ></a-entity>
            </a-entity>
             <a-entity  rotation="0 180 0" position="-10  0  22" scale="2 2 2">
                <a-entity gltf-model="#column"  ></a-entity>
                <a-entity gltf-model="#apollo" scale=".2 .2 .2" position="1.25  4  0" ></a-entity>
            </a-entity>
           
            <a-entity position="0 0 0">
                <!-- seating -->
                <a-cone material="src:simplegrad.png; repeat: 1 25" radius-bottom="12.5" radius-top="42" height="9" open-ended="true" position="0 4.5 0"
                 side="double" theta-length="180" theta-start="90"></a-cone>
                <a-cone material="src:simplegrad.png; repeat: 1 25" radius-bottom="43.5" radius-top="73" height="9" open-ended="true" position="0 13.5 0"
                 side="double" theta-length="180" theta-start="90"></a-cone>
                    <!-- back railing -->
                <a-torus color="#777" arc="180" radius="75" radius-tubular="0.05" scale="1 1 20" rotation="90 180 0" 
                    side="double" position="0 18 0">
                </a-torus>

                <!-- side walls of seating -->
                <a-cone color="gray" radius-bottom="42.05" radius-top="42" height="9" open-ended="true" position="0 4.5 0"
                 side="double" theta-length="180" theta-start="90"></a-cone>
                <a-triangle color="#AAA" vertex-a="-42.05 0 0" vertex-b="-12.5 0 0" vertex-c="-42 9 0"></a-triangle>
                <a-triangle color="#AAA" vertex-a="42.05 0 0" vertex-b="42 9 0" vertex-c="12.5 0 0" ></a-triangle> 
                <a-triangle color="#AAA" vertex-a="-73 9 0" vertex-b="-43.5 9 0" vertex-c="-73 18 0" ></a-triangle>
                <a-triangle color="#AAA" vertex-a="73 18 0" vertex-b="43.5 9 0" vertex-c="73 9 0" ></a-triangle>




                <!-- floor and back walls-->
                <a-circle color="#AAA" radius="12.8" rotation="-90 0 0" theta-length="180" theta-start="0" material="src: cobblestone.jpg; side:double;repeat: 12 12"></a-circle>
                <a-plane  material="src: cobblestone.jpg; side:double;repeat: 15 5" rotation="-90 0 0" height="20" width="60"
                position="0 0 10"></a-plane>
                <a-box color="#AAA" scale="60 3 .02" position="0 0 20"></a-box>
                <a-box color="#AAA" scale="0.02 3 20" position="30 0 10"></a-box>
                <a-box color="#AAA" scale="0.02 3 20" position="-30 0 10"></a-box>
 
                <!-- 2nd tier walkways -->
                <a-entity position="0 13.5 -58.15">
                    <a-plane  color="#AAA" side="double" rotation="-73 0 0" height="30.84" width="1.0" ></a-plane>
                </a-entity>
                <a-entity  rotation="0 45 0" >        
                    <a-entity position="0 13.5 -58.15">
                        <a-plane  color="#AAA" side="double" rotation="-73 0 0" height="30.84" width="1.0" ></a-plane>
                    </a-entity>
                </a-entity>
                <a-entity  rotation="0 -45 0" >        
                    <a-entity position="0 13.5 -58.15">
                        <a-plane  color="#AAA" side="double" rotation="-73 0 0" height="30.84" width="1.0" ></a-plane>
                    </a-entity>
                </a-entity>
                <a-entity  rotation="0 90 0" >        
                    <a-entity position="0.6 13.5 -58.15">
                        <a-plane  color="#AAA" side="double" rotation="-73 0 0" height="30.84" width="1.0" ></a-plane>
                    <a-cylinder  color="#AAA" side="double" rotation="-73 0 0" height="30.5" radius="0.05" scale="1 1 15" position="-0.55 0 -.2"></a-cylinder>
                    </a-entity>
                </a-entity>
                <a-entity  rotation="0 -90 0" >        
                    <a-entity position="-0.60 13.5 -58.15">
                        <a-plane  color="#AAA" side="double" rotation="-73 0 0" height="30.84" width="1.0" ></a-plane>
                    <a-cylinder  color="#AAA" side="double" rotation="-73 0 0" height="30.5" radius="0.05" scale="1 1 15" position="0.55 0 -.2"></a-cylinder>
                    </a-entity>
                </a-entity>
                <a-ring color="teal" side="double" radius-inner="72.95" radius-outer="75" position="0 18 0" rotation=" -90 0 0"
                    theta-length="180"></a-ring>
                <a-plane color="#AAA" width="2.1" height = "3" rotation = "0 0 0" position= "-74 16.5 0"></a-plane>
                <a-plane color="#AAA" width="2.1" height = "3" rotation = "0 180 0" position= "74 16.5 0"></a-plane>
                <a-cylinder color="#AAA" rotation="0 0 90" position ="-74 17.7 -.05" height="2.6" radius="1" scale="1 1 0.05"></a-cylinder>
                <a-cylinder color="#AAA" rotation="0 0 90" position ="74 17.7 -.05" height="2.6" radius="1" scale="1 1 0.05"></a-cylinder>

    

                <!-- 1st tier walkways -->
        
                <a-entity position="0 4.5 -27.15">
                    <a-plane  color="#AAA" side="double" rotation="-73 0 0" height="30.84" width="1.0" ></a-plane>
                </a-entity>
                <a-entity  rotation="0 45 0" >
                    <a-entity position="0 4.5 -27.15">
                        <a-plane  color="#AAA" side="double" rotation="-73 0 0" height="30.84" width="1.0" ></a-plane>
                    </a-entity>
                </a-entity>
                 <a-entity  rotation="0 -45 0">
                    <a-entity position="0 4.5 -27.15">
                        <a-plane  color="#AAA" side="double" rotation="-73 0 0" height="30.84" width="1.0" ></a-plane>
                    </a-entity>
                </a-entity>
                <a-entity  rotation="0 90 0" >
                    <a-entity position=".6 4.5 -27.15">
                        <a-plane  color="#AAA" side="double" rotation="-73 0 0" height="30.84" width="1.0" ></a-plane>
                        <a-cylinder  color="#AAA" side="double" rotation="-73 0 0" height="30.5" radius="0.05" scale="1 1 15" position="-0.55 0 -.2"></a-cylinder>
                    </a-entity>
                </a-entity>
                <a-entity  rotation="0 -90 0" >
                    <a-entity position="-.6 4.5 -27.15">
                        <a-plane  color="#AAA" side="double" rotation="-73 0 0" height="30.84" width="1.0" ></a-plane>
                        <a-cylinder  color="#AAA" side="double" rotation="-73 0 0" height="30.5" radius="0.05" scale="1 1 15" position="0.55 0 -0.2"></a-cylinder>
                    </a-entity>
                </a-entity>
                <a-ring color="teal" side="double" radius-inner="41.95" radius-outer="44" position="0 9 0" rotation=" -90 0 0"
                    theta-length="180"></a-ring>
                <a-plane color="#AAA" width="8" height = "3" rotation = "0 0 0" position= "-44 7.5 0"></a-plane>
                <a-plane color="#AAA" width="8" height = "3" rotation = "0 0 0" position= "44 7.5 0"></a-plane>
                <a-cylinder color="#AAA" rotation="0 0 87" position ="-42.8 8.73 -.05" height="2.03" radius="1" scale="1 1 0.05"></a-cylinder>
                <a-cylinder color="#AAA" rotation="0 0 93" position ="42.8 8.73 -.05" height="2.03" radius="1" scale="1 1 0.05"></a-cylinder>

                

                    <!-- pit railing -->
                <a-torus color="#777" arc="180" radius="11" radius-tubular="0.05" scale="1 1 10" rotation="90 180 0" side="double">
                    <a-sphere radius="0.1" position="11 0 0" color="#777" scale="1 1 1"></a-sphere>
                    <a-sphere radius="0.1" position="-11 0 0" color="#777" scale="1 1 1"></a-sphere>
                </a-torus>


                <!-- stage -->                
                <a-box color="#AAA" height="3" width="24" depth="6" position="0 0 5">
                    <a-box color="#AAA" height="3" width="2" depth="2" position="6 0 -3.5"></a-box>
                    <a-box color="#AAA" height="3" width="2" depth="2" position="-6 0 -3.5"></a-box>
                    <a-entity position="0 1.5 -3" rotation="30 180 0"> <!-- ramp -->
                        <a-box color="#AAA" height="2" width="2" depth="5" position="0 -1 2.5"></a-box>
                    </a-entity>
                    <!-- masks -->
                    <a-entity rotation="0 0 0" position="-3  1.5  -3" >
                        <a-entity gltf-model="#ComedyM"  scale="1 1 1" position="0 1.46 .03"></a-entity>
                        <a-cylinder height="3.1" radius=".01" color="Brown" ></a-cylinder>
                        <a-cylinder height=".02" radius=".1" color="Brown" position="0 1.45 0"></a-cylinder>
                    </a-entity>                    
                    <a-entity rotation="0 0 0" position="-2.5  1.5  -3" >
                        <a-entity gltf-model="#TragedyM"  scale="1 1 1" position="0 1.46 .01"></a-entity>
                        <a-cylinder height="3.1" radius=".01" color="Brown" ></a-cylinder>
                        <a-cylinder height=".02" radius=".1" color="Brown" position="0 1.45 0"></a-cylinder>
                    </a-entity>                    
                    <a-entity rotation="0 0 0" position="-2  1.5  -3" >
                        <a-entity gltf-model="#GreekM"  scale="1 1 1" position="0 1.46 .01" ></a-entity>
                        <a-cylinder height="3.1" radius=".01" color="Brown" ></a-cylinder>
                        <a-cylinder height=".02" radius=".1" color="Brown" position="0 1.45 0"></a-cylinder>
                    </a-entity>                    
                </a-box>
                <!-- backstage -->
                <a-box color="#AA9" height="3" width="42" depth="6" position="0 0 11">
                    <a-box color="#AA9" height="4" width="4" depth=".2" position="4 3.5 -2.9"></a-box>
                    <a-box color="#AA9" height="4" width="4" depth=".2" position="-4 3.5 -2.9"></a-box>
                    <a-box color="#AA9" height="4" width="10" depth=".2" position="-16 3.5 -2.9"></a-box>
                    <a-box color="#AA9" height="4" width="10" depth=".2" position="16 3.5 -2.9"></a-box>
                    <a-box color="#AA9" height="2" width="42" depth=".2" position="0 6.5 -2.9"></a-box>
                    <a-entity position="-21.0 1.5 1.50" rotation="0 00 25">
                        <a-box color="#AAA" height="2" width="5" depth="2" position="-2.5 -1.0 0"></a-box>
                    </a-entity>
                    
                </a-box>
                
                

            
            </a-entity>
 
 
 
            <a-entity environment="preset: forest; ground: hills; stageSize: 500; playArea: 10; groundYScale: 20; dressing: none; seed:3; 
            skyType: atmosphere; lighting:distant; lightPosition: -1 5 0 " 
            position="0 -.05 0"></a-entity>
            <!--  tree line -->
            <a-entity position="0 0 40 ">
                <a-cylinder radius="0.2" height ="4" color="tan" position="38 0 0">
                    <a-cone color="green" radius-bottom="1" radius-top="0.2" height = "10" position="0 7 0"></a-cone>
                </a-cylinder>
                <a-cylinder radius="0.2" height ="4" color="tan" position="33 0 0">
                    <a-cone color="green" radius-bottom="1" radius-top="0.2" height = "10" position="0 7 0"></a-cone>
                </a-cylinder>
                <a-cylinder radius="0.2" height ="4" color="tan" position="28 0 0">
                    <a-cone color="green" radius-bottom="2" radius-top="0.1" height = "8" position="0 7 0"></a-cone>
                    <a-sphere color="green" radius="2" position="0 3 0"></a-sphere>
                </a-cylinder>
                 <a-cylinder radius="0.2" height ="4" color="tan" position="18 0 0">
                    <a-cone color="green" radius-bottom="1" radius-top="0.2" height = "10" position="0 7 0"></a-cone>
                </a-cylinder>
                <a-cylinder radius="0.2" height ="4" color="tan" position="21 0 0">
                    <a-cone color="green" radius-bottom="1" radius-top="0.2" height = "10" position="0 7 0"></a-cone>
                </a-cylinder>
                <a-cylinder radius="0.2" height ="4" color="tan" position="10 0 0">
                    <a-cone color="green" radius-bottom="2" radius-top="0.1" height = "8" position="0 7 0"></a-cone>
                    <a-sphere color="green" radius="2" position="0 3 0"></a-sphere>
                </a-cylinder>
                
                <a-cylinder radius="0.2" height ="4" color="tan" position="5 0 0">
                    <a-cone color="green" radius-bottom="1" radius-top="0.2" height = "10" position="0 7 0"></a-cone>
                </a-cylinder>
                <a-cylinder radius="0.2" height ="4" color="tan" position="0 0 0">
                    <a-cone color="green" radius-bottom="2" radius-top="0.1" height = "8" position="0 7 0"></a-cone>
                    <a-sphere color="green" radius="2" position="0 3 0"></a-sphere>
                </a-cylinder>
                
                <a-cylinder radius="0.2" height ="4" color="tan" position="-8 0 0">
                    <a-cone color="green" radius-bottom="1" radius-top="0.2" height = "10" position="0 7 0"></a-cone>
                </a-cylinder>
                <a-cylinder radius="0.2" height ="4" color="tan" position="-12 0 0">
                    <a-cone color="green" radius-bottom="1" radius-top="0.2" height = "10" position="0 7 0"></a-cone>
                </a-cylinder>
                <a-cylinder radius="0.2" height ="4" color="tan" position="-20 0 0">
                    <a-cone color="green" radius-bottom="2" radius-top="0.1" height = "8" position="0 7 0"></a-cone>
                    <a-sphere color="green" radius="2" position="0 3 0"></a-sphere>
                </a-cylinder>
                
                <a-cylinder radius="0.2" height ="4" color="tan" position="-31 0 0">
                    <a-cone color="green" radius-bottom="1" radius-top="0.2" height = "10" position="0 7 0"></a-cone>
                </a-cylinder>
                <a-cylinder radius="0.2" height ="4" color="tan" position="-32 0 0">
                    <a-cone color="green" radius-bottom="1" radius-top="0.2" height = "10" position="0 7 0"></a-cone>
                </a-cylinder>
                <a-cylinder radius="0.2" height ="4" color="tan" position="-40 0 0">
                    <a-cone color="green" radius-bottom="2" radius-top="0.1" height = "8" position="0 7 0"></a-cone>
                    <a-sphere color="green" radius="2" position="0 3 0"></a-sphere>
                </a-cylinder>
                
            </a-entity>
            <!-- hills  -->
            <a-sphere color="green" scale="60 35 70"  position="-80 -20 0"></a-sphere>
            <a-sphere color="green" scale="60 35 70"  position="80 -20 0"></a-sphere>
                       
            
            
        <a-entity visible="false" gltf-model="BasicTheatre3Navmesh.gltf" nav-mesh></a-entity>

        <!-- 
        camera controls as per aframe extras: 
            https://github.com/c-frame/aframe-extras
            https://github.com/c-frame/aframe-extras/tree/master/src/controls
        -->
		<a-entity id="rig" movement-controls="constrainToNavMesh: true; speed: 0.08" position="0 1.5 7" >
		  <a-entity camera 
			position="0 1.6 0"
			look-controls="pointerLockEnabled: true">
		      <a-entity id="scriptpage" 
		      text="color:orange;value:test;" scale=".7 .7 .7" position="-0 -.15 -1"></a-entity>
    		<a-entity visible="false" meta-touch-controls="hand: left" ></a-entity>	
    		<a-entity visible="false" meta-touch-controls="hand: right" ></a-entity>	
    		<a-cursor nav-pointer  raycaster="objects: [nav-mesh]"
			visible="false"></a-cursor>
		  </a-entity>
		</a-entity>

        </a-scene>
        <script src="theaterMonologuesPager.js"></script>
    </body>
</html>
